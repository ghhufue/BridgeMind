[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgemind"
version = "0.1.0"
description = "Bridge AI environment and independent double-dummy solver service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
bridge = ["open-spiel==2.0.2"]
train = ["open-spiel==2.0.2", "numpy>=2", "torch>=2.7"]

[project.scripts]
bridgemind-dds = "bridgemind.dds.server:main"
bridgemind-train = "bridgemind.training.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

